name: conti_app
description: "예배팀 콘티(세트리스트) + 찬양 데이터베이스 협업 플랫폼"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  json_annotation: ^4.9.0
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  shimmer: ^3.0.0
  web: ^1.1.0
  shared_preferences: ^2.3.4
  fl_chart: ^0.70.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.9.4
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
